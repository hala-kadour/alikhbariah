name: alikhbariah
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  i18n_extension: ^15.1.0
  json_annotation: ^4.10.0
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  reactive_forms: ^18.2.2
  skeletonizer: ^2.1.3
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.12.0
  shared_preferences: ^2.5.4
  google_nav_bar: ^5.0.7
  reactive_dropdown_search: ^6.0.0-pre4
  lottie: ^3.3.2
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  awesome_notifications: ^0.11.0
  reactive_file_picker: ^4.0.1
  objectbox_flutter_libs: ^5.2.0
  objectbox: ^5.2.0
  dio: ^5.9.1
  dartz: ^0.10.1
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  objectbox_generator: ^5.2.0
  i18n_extension_importer: ^0.0.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/pngs/app_icon.png"
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/pngs/splash_icon.png"

  android_12:
    image: "assets/images/pngs/splash_icon.png"
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

  fullscreen: true

flutter:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/poppins/Poppins-Black.ttf
          weight: 900
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
    - family: AppIcons
      fonts:
        - asset: assets/icons/app_icons.ttf
  uses-material-design: true
  assets:
    - assets/translations/
    - .env
    - assets/images/svgs/
    - assets/images/pngs/
    - assets/animation/
